name: YouTube Private Upload (Manual Approval)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Clip Factory run ID containing the video artifact"
        required: true
        type: string
      artifact_name:
        description: "Artifact name, e.g. academy-clip-physics-doppler-effect"
        required: true
        type: string
      title:
        description: "Reviewed YouTube title (maximum 100 characters)"
        required: true
        type: string
      description:
        description: "Reviewed YouTube description"
        required: true
        type: string
      tags:
        description: "Comma-separated tags"
        required: false
        type: string
      made_for_kids:
        description: "Audience declaration for this specific video"
        required: true
        type: choice
        options:
          - "false"
          - "true"

permissions:
  actions: read
  contents: read

concurrency:
  group: youtube-private-upload
  cancel-in-progress: false

jobs:
  upload-private:
    name: Upload video privately for channel-owner review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download reviewed Clip Factory artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: incoming-artifact

      - name: Install YouTube API client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Upload privately, then set thumbnail and captions
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          VIDEO_TAGS: ${{ inputs.tags }}
          MADE_FOR_KIDS: ${{ inputs.made_for_kids }}
        run: |
          python creator-studio/publish_youtube_private.py \
            --artifact "incoming-artifact" \
            --title "$VIDEO_TITLE" \
            --description "$VIDEO_DESCRIPTION" \
            --tags "$VIDEO_TAGS" \
            --made-for-kids "$MADE_FOR_KIDS"
