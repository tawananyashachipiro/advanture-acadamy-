name: Adventure of Education Security Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "creator-studio/**"
      - ".github/workflows/**"
      - "requirements*.txt"
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: academy-security-check
  cancel-in-progress: false

jobs:
  security:
    name: Check dependencies and repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Scan tracked files for common secret patterns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          files = subprocess.check_output(
              ["git", "ls-files", "-z"], text=True
          ).split("\0")
          patterns = [
              ("private key", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
              ("GitHub token", re.compile(r"gh[pousr]_[A-Za-z0-9_]{20,}")),
              ("AWS access key", re.compile(r"AKIA[0-9A-Z]{16}")),
              ("generic credential assignment", re.compile(r"(?i)(client_secret|access_token|refresh_token|password)\s*[:=]\s*['\"][^'\"]{12,}")),
          ]
          findings = []
          for name in files:
              if not name:
                  continue
              path = Path(name)
              if not path.is_file() or path.stat().st_size > 1_000_000:
                  continue
              try:
                  data = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for label, pattern in patterns:
                  if pattern.search(data):
                      findings.append((name, label))
          if findings:
              for name, label in findings:
                  print(f"Potential {label} in tracked file: {name}")
              print("Review findings. Do not print or commit credential values.")
              sys.exit(1)
          print("No common secret patterns detected in tracked text files.")
          PY

      - name: Install native libraries for Manim dependency checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libcairo2-dev libpango1.0-dev

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          if [ -f creator-studio/requirements.txt ]; then
            pip-audit -r creator-studio/requirements.txt
          fi

      - name: Check workflow permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          for p in Path(".github/workflows").glob("*.yml"):
              text = p.read_text(encoding="utf-8")
              if re.search(r"(?m)^\s*permissions:\s*write-all\s*$", text):
                  print(f"Broad write-all permissions found: {p}")
                  sys.exit(1)
          print("No write-all workflow permission declarations found.")
          PY
