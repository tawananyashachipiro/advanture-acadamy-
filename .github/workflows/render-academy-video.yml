name: Adventure Academy Clip Factory

on:
  workflow_dispatch:
    inputs:
      lesson_id:
        description: "Choose one lesson to render as a YouTube Short"
        required: true
        type: choice
        options:
          - biology-cell-quest
          - chemistry-atoms-quest
          - physics-forces-quest
          - geography-water-cycle
          - history-great-zimbabwe
          - history-antikythera-mechanism
          - physics-lightning-explained
          - why-sky-blue
          - physics-doppler-effect
          - computing-algorithms
          - business-enterprise
          - shona-proverbs
          - art-colour-theory
          - maths-fractions
          - science-states-matter
          - library-source-check
          - apollo-13-rescue
          - hubble-repair-mission
          - black-hole-first-image
          - voyager-golden-record
          - atom-to-galaxy-scale
          - gps-satellite-navigation
          - bioluminescence-ocean
          - roman-concrete
          - moon-phases
          - deep-ocean-pressure
          - neptune-math-discovery

permissions:
  contents: read

concurrency:
  group: academy-clip-factory
  cancel-in-progress: false

jobs:
  build-clip:
    name: Build \${{ inputs.lesson_id }} video and publishing pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: creator-studio/requirements.txt

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --upgrade pip
          python -m pip install -r creator-studio/requirements.txt
          python -m pip install piper-tts

      - name: Build selected lesson package
        env:
          LESSON_ID: \${{ inputs.lesson_id }}
        run: |
          python creator-studio/build_clip.py --lesson "$LESSON_ID"

      - name: Save video and creator pack
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: academy-clip-\${{ inputs.lesson_id }}
          path: creator-studio/dist/\${{ inputs.lesson_id }}/
          if-no-files-found: error
          retention-days: 14
