name: Adventure Academy Clip Factory

on:
  push:
    branches: [main]
    paths:
      - "creator-studio/trigger/atom-to-galaxy-scale.txt"
  workflow_dispatch:
    inputs:
      lesson_id:
        description: "Choose the lesson to turn into a YouTube Short"
        required: true
        type: choice
        options:
          - biology-cell-quest
          - chemistry-atoms-quest
          - physics-forces-quest
          - geography-water-cycle
          - history-great-zimbabwe
          - history-antikythera-mechanism
          - physics-lightning-explained
          - why-sky-blue
          - physics-doppler-effect
          - computing-algorithms
          - business-enterprise
          - shona-proverbs
          - art-colour-theory
          - maths-fractions
          - science-states-matter
          - library-source-check
          - apollo-13-rescue
          - hubble-repair-mission
          - black-hole-first-image
          - voyager-golden-record
          - atom-to-galaxy-scale
      use_moneyprinterturbo:
        description: "Also run the optional local-only MoneyPrinterTurbo finishing pass (uses extra Actions minutes)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: academy-clip-factory
  cancel-in-progress: false

jobs:
  build-clip:
    name: Build lesson video and publishing pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: creator-studio/requirements.txt

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --upgrade pip
          python -m pip install -r creator-studio/requirements.txt
          python -m pip install piper-tts

      - name: Build selected lesson package
        env:
          LESSON_ID: ${{ inputs.lesson_id || 'atom-to-galaxy-scale' }}
        run: |
          python creator-studio/build_clip.py --lesson "$LESSON_ID"

      - name: Run MoneyPrinterTurbo local finishing pass
        if: ${{ inputs.use_moneyprinterturbo == true }}
        env:
          LESSON_ID: ${{ inputs.lesson_id || 'atom-to-galaxy-scale' }}
        run: |
          python -m pip install "mpt==1.3.10"
          mkdir -p "$RUNNER_TEMP/moneyprinterturbo"
          cd "$RUNNER_TEMP/moneyprinterturbo"
          mpt cli \
            --video-script "$(cat "$GITHUB_WORKSPACE/creator-studio/dist/$LESSON_ID/voiceover-script.txt")" \
            --video-source local \
            --video-materials "$GITHUB_WORKSPACE/creator-studio/dist/$LESSON_ID/AdventureAcademyShort-silent.mp4" \
            --custom-audio-file "$GITHUB_WORKSPACE/creator-studio/dist/$LESSON_ID/voiceover.wav" \
            --voice-name no-voice \
            --no-subtitle-enabled \
            --bgm-type none \
            --video-aspect 9:16 \
            --video-count 1

          # MoneyPrinterTurbo writes to HOME, not RUNNER_TEMP. Copy its output
          # into the artifact staging directory used by upload-artifact.
          mkdir -p "$RUNNER_TEMP/moneyprinterturbo/storage/tasks"
          if [ -d "$HOME/.local/share/MoneyPrinterTurbo/storage/tasks" ]; then
            cp -a "$HOME/.local/share/MoneyPrinterTurbo/storage/tasks/." "$RUNNER_TEMP/moneyprinterturbo/storage/tasks/"
          fi
          test -n "$(find "$RUNNER_TEMP/moneyprinterturbo/storage/tasks" -type f -print -quit)"

      - name: Save MoneyPrinterTurbo output
        if: ${{ inputs.use_moneyprinterturbo == true }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: moneyprinterturbo-${{ inputs.lesson_id || 'atom-to-galaxy-scale' }}
          path: ${{ runner.temp }}/moneyprinterturbo/storage/tasks/
          if-no-files-found: error
          retention-days: 14

      - name: Save video and creator pack
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: academy-clip-${{ inputs.lesson_id || 'atom-to-galaxy-scale' }}
          path: creator-studio/dist/${{ inputs.lesson_id || 'atom-to-galaxy-scale' }}/
          if-no-files-found: error
          retention-days: 14
